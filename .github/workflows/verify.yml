name: verify

# Checks the publication copy on every change. CPU only; nothing here trains a model.
on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publication:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Every file matches the manifest; every local Markdown link resolves
        run: python tools/verify_publication.py
      - name: Estimator fixture (equivalence, known-exponent recovery, guards)
        run: |
          work="$(mktemp -d)"
          cp outputs/sequence-weighting-pilot/core.py outputs/sequence-weighting-pilot/core_checks.py "$work/"
          cd "$work" && python core_checks.py > /dev/null && python -c "import json; assert json.load(open('CORE_CHECKS.json'))['status'] == 'passed'"
      - name: N7's primary contrast from the published table (the README example)
        run: |
          python - <<'PY'
          import csv, math, statistics as st
          rows = csv.DictReader(open("reports/natural-text-matched-analysis-20261105-01/POINTS.csv"))
          P = {(r["draw"], float(r["epoch"]), int(r["width"]), r["tag"]): r for r in rows}
          draws, rate = sorted({k[0] for k in P}), "lr1e-04"
          path = [e for e in sorted({k[1] for k in P}) if 2.0 <= e <= 3.5]
          def p1(d):
              target = float(P[(d, 3.0, 512, rate)]["train"])
              pts = [(float(P[(d, e, 768, rate)]["train"]), float(P[(d, e, 768, rate)]["p"])) for e in path]
              for (x0, y0), (x1, y1) in zip(pts, pts[1:]):
                  if min(x0, x1) <= target <= max(x0, x1):
                      return float(P[(d, 3.0, 512, rate)]["p"]) - (y0 + (target - x0) / (x1 - x0) * (y1 - y0))
          v = [p1(d) for d in draws]
          half = 2.5706 * st.stdev(v) / math.sqrt(len(v))
          out = f"{st.mean(v):+.5f} [{st.mean(v) - half:+.5f}, {st.mean(v) + half:+.5f}]"
          print("P1 =", out)
          assert out == "+0.00909 [+0.00400, +0.01417]", out
          PY

  loss-arrays:
    # Refits all 240 N7 estimates from the loss-array bundle attached to the v1.2 release, when that release exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch the bundle
        id: fetch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Skip only when the v1.2 release does not exist yet (HTTP 404); any other failure fails the job.
          code=$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/releases/tags/v1.2")
          if [ "$code" = "404" ]; then
            echo "No v1.2 release yet; skipping." && echo "ok=false" >> "$GITHUB_OUTPUT" && exit 0
          fi
          [ "$code" = "200" ] || { echo "GitHub API returned HTTP $code"; exit 1; }
          gh release download v1.2 --repo "${{ github.repository }}" --pattern n7-loss-arrays-v1.zip --dir "$RUNNER_TEMP"
          unzip -q "$RUNNER_TEMP/n7-loss-arrays-v1.zip" -d "$RUNNER_TEMP"
          echo "ok=true" >> "$GITHUB_OUTPUT"
      - name: Refit every estimate and recompute the confirmed contrasts
        if: steps.fetch.outputs.ok == 'true'
        run: |
          python -m pip install --quiet numpy
          python tools/verify_n7_losses.py "$RUNNER_TEMP/n7-loss-arrays"
